name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_26.6.app # App Store uploads require Xcode 26+ since 2026-04-28
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  hygiene:
    name: Hygiene gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: App icon is 1024x1024 with no alpha
        run: |
          info="$(file apps/TallyiOS/Tally/Assets.xcassets/AppIcon.appiconset/Icon-1024.png)"
          echo "$info"
          echo "$info" | grep -q "1024 x 1024, 8-bit/color RGB,"
      - name: No fabricated calendar or notification writes (PMO R12)
        run: |
          ! grep -rnE "Calculus III Midterm|simulated_exam_alert|simulated_event_1" packages apps
      - name: Go-live placeholders (report only; the release gate enforces)
        run: scripts/go-live/find-placeholders.sh || echo "::notice::Go-live placeholders remain (expected before go-live, see docs/GO-LIVE.md GL-02)"
      - name: No debug logging, Task.detached or unaudited concurrency flags in shipping code
        # perf-app-runtime.md section 6. Task.detached drops priority, task-locals and
        # cancellation (use @concurrent). Turning on NonisolatedNonsendingByDefault moves
        # nonisolated async work onto the caller, which can be the main actor, so it
        # needs a recorded audit first.
        run: |
          if git grep -nE "DEBUG-NAV|NSLog\(|\bprint\(|Task\.detached|NonisolatedNonsendingByDefault" -- \
              packages/TallyCore/Sources packages/TallyAppleKit/Sources \
              apps/TallyiOS/Tally apps/TallyiOS/TallyWidgets \
              ':!packages/TallyCore/Sources/TallyTestSupport'; then
            echo "::error::Banned pattern in shipping code (lines above)"
            exit 1
          fi
      - name: The Home shell (a TabView) is built only in RootView.swift, as a root route
        # perf-app-runtime.md section 3 item 2. A TabView or NavigationStack pushed as a
        # navigationDestination never renders (2d3131f bisect), so the Home shell may be
        # constructed only by RootView's route switch. The TallyUITests root-switch
        # assertions cover a push written inside RootView.swift itself.
        run: |
          if git grep -n "HomeShellView(" -- packages apps/TallyiOS/Tally apps/TallyiOS/TallyWidgets \
              ':!packages/TallyAppleKit/Sources/TallyFeatures/RootView.swift'; then
            echo "::error::HomeShellView constructed outside RootView.swift (lines above)"
            exit 1
          fi
      - name: Perf budget checker self-test (scripts/ci/check_perf_budgets.py)
        run: python3 scripts/ci/check_perf_budgets.py --self-test

  core-linux:
    name: TallyCore tests (Linux, Swift 6.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: docker.io/library/swift@sha256:3fd7537e088df14007e5c9dd71a1b4d91b19067df727b17294ae0f6ea79f6423 # 6.4.0-noble; same digest as `make core-test`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sources and tests (warnings are errors)
        working-directory: packages/TallyCore
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Test
        working-directory: packages/TallyCore
        run: swift test

  lint:
    name: Crash-safety lint (SwiftLint 0.59.1, pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make lint (force_unwrapping, force_try, force_cast, implicitly_unwrapped_optional)
        run: make lint CONTAINER=docker

  core-sanitizers:
    name: TallyCore sanitizers (TSan + ASan/LSan, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # TSan needs a memory layout that high ASLR entropy breaks. The Makefile already
      # disables ASLR for the test process (setarch -R, crash-safety.md CS-04); this
      # lowers the kernel's entropy as well, as belt and braces on the hosted runner.
      - name: Lower mmap ASLR entropy for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: ThreadSanitizer (make core-tsan)
        run: |
          set -o pipefail
          make core-tsan CONTAINER=docker 2>&1 | tee "$RUNNER_TEMP/tsan.log"
          ! grep -q "WARNING: ThreadSanitizer" "$RUNNER_TEMP/tsan.log"
      - name: AddressSanitizer + LeakSanitizer (make core-asan)
        run: |
          set -o pipefail
          make core-asan CONTAINER=docker 2>&1 | tee "$RUNNER_TEMP/asan.log"
          ! grep -qE "ERROR: (AddressSanitizer|LeakSanitizer)" "$RUNNER_TEMP/asan.log"

  core-perf:
    name: TallyCore perf gates (Linux, release, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Timing on shared runners is noisy. Report-only until the PMO has seen five
    # green runs on main (perf-app-runtime.md D-P3); after that it becomes required.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make core-perf (median of >= 5, release)
        run: |
          set -o pipefail
          make core-perf CONTAINER=docker 2>&1 | tee "$RUNNER_TEMP/perf.log"
          grep -E "^PERF(-BUDGET|-SCALING)? \|" "$RUNNER_TEMP/perf.log" || true

  ios-build:
    name: iOS build + test (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - name: TallyCore tests (Xcode 26.6 Swift toolchain)
        working-directory: packages/TallyCore
        run: swift test
      - name: Install XcodeGen (checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        working-directory: apps/TallyiOS
        run: xcodegen generate --spec project.yml
      - name: Build for iOS Simulator (Debug)
        working-directory: apps/TallyiOS
        run: |
          set -o pipefail
          xcodebuild build -project Tally.xcodeproj -scheme Tally \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dd" | tee "$RUNNER_TEMP/build-sim.log" | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build-sim.log"
      - name: Pick an iOS 26 simulator (never a hard-coded device name)
        id: sim
        run: python3 scripts/ci/pick_ios_simulator.py >> "$GITHUB_OUTPUT"
      # The test steps call the Makefile's ios-* targets (perf-app-runtime.md §6), so CI and a
      # local Mac run the same commands. Each test target prints every xcresult failure in full
      # (scripts/ci/print_xcresult_failures.py) whatever the result, then fails unless xcodebuild
      # reported success. `ios-test` also sets a per-test hang limit (120 s default, 300 s max).
      - name: Build TallyAppTests + TallyUITests for testing
        run: make ios-build-for-testing IOS_OUT="$RUNNER_TEMP/ios" IOS_DERIVED="$RUNNER_TEMP/dd"
      - name: Run TallyAppTests and TallyUITests (every failure printed in full)
        # `test-without-building` prints "** TEST EXECUTE SUCCEEDED **", not plain "TEST
        # SUCCEEDED" (run 36330806691); the target accepts both.
        run: |
          make ios-test IOS_OUT="$RUNNER_TEMP/ios" IOS_DERIVED="$RUNNER_TEMP/dd" \
            IOS_SIM_UDID="${{ steps.sim.outputs.udid }}"
      - name: Main-thread watchdog stalls during the UI tests (phase, length)
        # Calibration evidence for the DEBUG watchdog (perf-app-runtime.md §5.1: calibrate before
        # it becomes required): every stall past 250 ms, launch-phase ones included.
        if: always()
        run: make ios-watchdog-log IOS_SIM_UDID="${{ steps.sim.outputs.udid }}"
      - name: Pick the smallest iOS 26 iPhone simulator
        id: small
        run: python3 scripts/ci/pick_ios_simulator.py --smallest >> "$GITHUB_OUTPUT"
      - name: Welcome CTAs on the smallest iPhone (hittable at launch and at AX XXXL)
        # perf-app-runtime.md §7 step 3: both pinned CTAs are hittable right after launch on
        # the smallest available iPhone, at the default size and at the largest text size.
        run: |
          echo "Smallest iPhone: ${{ steps.small.outputs.name }} on ${{ steps.small.outputs.runtime }}"
          make ios-test IOS_OUT="$RUNNER_TEMP/ios" IOS_DERIVED="$RUNNER_TEMP/dd" \
            IOS_SIM_UDID="${{ steps.small.outputs.udid }}" \
            IOS_ONLY_TESTING=-only-testing:TallyUITests/WelcomeCTAUITests IOS_RESULT_NAME=Tally-small
      - name: Pick the oldest iOS 26 simulator (deployment floor)
        id: floor
        run: |
          xcrun simctl list runtimes | grep -E "^iOS" || true
          python3 scripts/ci/pick_ios_simulator.py --oldest >> "$GITHUB_OUTPUT"
      # The app supports iOS 26.0, but the test above runs on the newest 26.x.
      # Some runtime bugs affect only early 26.x releases (swiftlang/swift#88036,
      # fixed in 26.4), so the hosted tests also run on the lowest 26.x here.
      # Report-only until its first green runs (PMO), then it becomes required.
      - name: TallyAppTests on the deployment-floor runtime (report-only for now)
        if: steps.floor.outputs.runtime != steps.sim.outputs.runtime
        continue-on-error: true
        run: |
          echo "Deployment-floor runtime: ${{ steps.floor.outputs.runtime }}"
          make ios-test IOS_OUT="$RUNNER_TEMP/ios" IOS_DERIVED="$RUNNER_TEMP/dd" \
            IOS_SIM_UDID="${{ steps.floor.outputs.udid }}" \
            IOS_ONLY_TESTING=-only-testing:TallyAppTests IOS_RESULT_NAME=Tally-floor
      - name: Summarize test counts (PMO evidence requirement)
        if: always()
        run: make ios-summary IOS_RESULT="$RUNNER_TEMP/ios/Tally.xcresult"
      - name: Collect simulator crash reports
        # perf-app-runtime.md §6: a crash (for example the DEBUG main-thread watchdog's
        # deliberate one) leaves a Tally*.ips report; whether xcresult embeds it is UNVERIFIED.
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ios/crash-reports"
          find "$HOME/Library/Logs/DiagnosticReports" -name 'Tally*.ips' -newer "$GITHUB_WORKSPACE/Makefile" \
            -exec cp {} "$RUNNER_TEMP/ios/crash-reports/" \; 2>/dev/null || true
          ls -l "$RUNNER_TEMP/ios/crash-reports"
      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-reports
          path: ${{ runner.temp }}/ios/crash-reports
          if-no-files-found: ignore
          retention-days: 7
      - name: Build for iOS device (Release, unsigned)
        working-directory: apps/TallyiOS
        run: |
          set -o pipefail
          xcodebuild build -project Tally.xcodeproj -scheme Tally \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build-device.log" | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build-device.log"
      - name: Verify built app identity
        run: |
          app="$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -1)"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :TallyOrgDomain" "$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :TallyAppGroupID" "$app/Info.plist"
      - name: Upload build logs and .xcresult on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/build-device.log
            ${{ runner.temp }}/build-sim.log
            ${{ runner.temp }}/ios/*.log
            ${{ runner.temp }}/ios/*.xcresult
          retention-days: 7

  ios-xcode27-forward-compat:
    name: iOS forward-compat (Xcode 27 preview, non-blocking)
    runs-on: xcode-27
    timeout-minutes: 30
    continue-on-error: true # preview image; must never gate the required checks above
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode version on this runner
        run: xcodebuild -version
      - name: Install XcodeGen (checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        working-directory: apps/TallyiOS
        run: xcodegen generate --spec project.yml
      - name: Build for iOS Simulator (Debug) on the iOS 27 SDK
        working-directory: apps/TallyiOS
        run: |
          set -o pipefail
          xcodebuild build -project Tally.xcodeproj -scheme Tally \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dd" | tee "$RUNNER_TEMP/build-sim-xcode27.log" \
            | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build-sim-xcode27.log"
      - name: Pick an iOS 27 simulator
        id: sim27
        run: python3 scripts/ci/pick_ios_simulator.py --min-major 27 >> "$GITHUB_OUTPUT"
      - name: TallyAppTests + TallyUITests on the iOS 27 SDK
        working-directory: apps/TallyiOS
        run: |
          set -o pipefail
          xcodebuild test -project Tally.xcodeproj -scheme Tally \
            -destination "platform=iOS Simulator,id=${{ steps.sim27.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/Tally-xcode27.xcresult" \
            -collect-test-diagnostics never \
            | tee "$RUNNER_TEMP/test-xcode27.log" | grep -E "error:|Test Suite|BUILD (SUCCEEDED|FAILED)| passed| failed" || true
          grep -q "TEST SUCCEEDED" "$RUNNER_TEMP/test-xcode27.log"
      - name: Summarize test results
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/Tally-xcode27.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Tally-xcode27.xcresult" \
              --compact --format json > "$RUNNER_TEMP/test-summary-xcode27.json" || true
            python3 scripts/ci/print_xcresult_failures.py "$RUNNER_TEMP/test-summary-xcode27.json"
          fi
      - name: Upload build/test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs-xcode27
          path: |
            ${{ runner.temp }}/build-sim-xcode27.log
            ${{ runner.temp }}/test-xcode27.log
            ${{ runner.temp }}/Tally-xcode27.xcresult
          retention-days: 7
