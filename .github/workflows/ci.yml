name: CI
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  actions: write
jobs:
  build-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install xcodegen
      - name: Generate Xcode Project
        run: xcodegen -s apps/TallyiOS/project.yml
      - name: Build Unsigned App
        run: |
          xcodebuild clean build \
            -project apps/TallyiOS/TallyApp.xcodeproj \
            -scheme TallyApp \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Debug-iphoneos/TallyApp.app Payload/
          zip -r TallyApp.ipa Payload
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TallyApp-Unsigned-IPA
          path: TallyApp.ipa

