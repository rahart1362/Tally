version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # SEC1-21: the root Package.swift this entry once covered was the legacy, unlinked package with
  # no remote dependencies (REL.go-live.unlinked-legacy); CLEANUP-1 deleted it along with every
  # package it served. The one real remote pin -- swift-crypto, plus swift-asn1 -- lives in these
  # two Package.swift files instead.
  - package-ecosystem: swift
    directory: /packages/TallyCore
    schedule:
      interval: weekly
  - package-ecosystem: swift
    directory: /tools/sign-institution-registry
    schedule:
      interval: weekly
