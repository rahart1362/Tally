name: TallyApp
options:
  xcodeVersion: "15.4"
targets:
  TallyApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TallyApp
    infoPlist: TallyApp/Info.plist
    # App identity (bundle ID, team, domain) lives ONLY in this file. GO-LIVE blocker GL-02.
    configFiles:
      Debug: Config/Identity.xcconfig
      Release: Config/Identity.xcconfig
    dependencies:
      - package: TallyPackages
        product: TallyAppFeature
packages:
  TallyPackages:
    path: ../../

