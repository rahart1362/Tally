name: Tally
options:
  xcodeVersion: "26.6"
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # iPhone only (fixes ASC-F07: the old project.yml left XcodeGen's iOS
    # preset default of "1,2", making the app accidentally iPad-capable).
    TARGETED_DEVICE_FAMILY: "1"
    # A single shared value both the app and the widget entitlements read.
    # Deliberately NOT derived from $(PRODUCT_BUNDLE_IDENTIFIER): the widget
    # target below overrides that setting to its own sub-identifier, and
    # Xcode resolves a macro against each target's own effective build
    # settings, so an App-Group value built from
    # "group.$(PRODUCT_BUNDLE_IDENTIFIER)" (Identity.xcconfig's
    # TALLY_APP_GROUP_ID) would silently diverge between the two targets.
    # Building it from TALLY_BUNDLE_ID_PREFIX instead keeps one literal
    # group string for both, without editing Identity.xcconfig.
    TALLY_SHARED_APP_GROUP_ID: group.$(TALLY_BUNDLE_ID_PREFIX).tally

packages:
  TallyCore:
    path: ../../packages/TallyCore
  TallyAppleKit:
    path: ../../packages/TallyAppleKit

targets:
  Tally:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tally
      # M3-D: the Control Center controls' app intents. A control's action must be compiled into
      # the app and the widget extension both (Apple, "Creating controls to perform actions
      # across the system"), and the system performs these in the app's process. The widget target
      # takes the same directory through its own `TallyWidgets` source, so the widget isolation
      # gate scans it (scripts/ci/check_widget_isolation.py).
      - path: TallyWidgets/Shared
    configFiles:
      Debug: Config/Identity.xcconfig
      Release: Config/Identity.xcconfig
    entitlements:
      path: Tally/Tally.entitlements
    settings:
      base:
        # Required for `@main` to resolve outside a file literally named
        # main.swift. Xcode's own App/Widget-extension *templates* set this
        # silently; a target authored directly in project.yml (as every
        # target here is, since there is no Xcode on this host) does not
        # get it for free. Confirmed by CI run 36328840843: without this,
        # TallyWidgetsBundle.swift failed with "cannot find type 'Widget'/
        # 'WidgetBundle' in scope" even though the sibling file in the same
        # target, with the same `import WidgetKit`, compiled cleanly.
        OTHER_SWIFT_FLAGS: -parse-as-library
        # iPhone only (ASC-F07), set on the target: XcodeGen's iOS platform
        # preset puts TARGETED_DEVICE_FAMILY '1,2' at target level, which
        # overrides the project-level "1" above. The release gate's first run
        # (36465775989) found UIDeviceFamily [1, 2] in both built apps.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated/Tally-Info.plist
      properties:
        CFBundleDisplayName: Tally
        # Plan 08 L10N-01: English is the development language, and the languages Tally ships
        # are listed here. iOS offers the per-app Language setting from the main bundle's
        # localizations (L-2); Tally/InfoPlist.xcstrings supplies en.lproj. Main ships en only
        # (Spanish is L10N-04). Keep this list equal to the widget's and to the catalogs'
        # languages (scripts/ci/check_string_catalogs.py).
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
        ITSAppUsesNonExemptEncryption: NO
        TallyOrgDomain: $(TALLY_ORG_DOMAIN)
        TallyAppGroupID: $(TALLY_SHARED_APP_GROUP_ID)
    dependencies:
      - package: TallyAppleKit
        product: TallyDesignSystem
      - package: TallyAppleKit
        product: TallyPlatform
      - package: TallyAppleKit
        product: TallyFeatures
      - package: TallyAppleKit
        product: TallyIntents
      # M3-D: the app's App Intents (`Tally/Intents/`) read the glance (`GlanceReader.appProcess`)
      # and phrase their answers (`GlanceIntentAnswers`, `L10n`).
      - package: TallyAppleKit
        product: TallyGlance
      - package: TallyAppleKit
        product: TallyStrings
      # The composition root (`TallyApp.swift`, `AppEnvironment.swift`) imports
      # TallyDomain and TallySync directly; since perf-app-runtime.md §7 step 7
      # `.backgroundTask` reaches the account's coordinator through
      # `AccountRuntime` (TallyFeatures) rather than holding one itself.
      # TallyStore and TallyCanvasAPI (plan 07 M2-C1): `AppEnvironment` builds the
      # process's one `VaultKeyring` and hands the Canvas transport to the account.
      - package: TallyCore
        product: TallyDomain
      - package: TallyCore
        product: TallySync
      - package: TallyCore
        product: TallyStore
      - package: TallyCore
        product: TallyCanvasAPI
      - target: TallyWidgets
        embed: true

  TallyWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TallyWidgets
    configFiles:
      Debug: Config/Identity.xcconfig
      Release: Config/Identity.xcconfig
    entitlements:
      path: TallyWidgets/TallyWidgets.entitlements
    settings:
      base:
        # A distinct sub-identifier of the app's bundle ID, as extensions
        # require. Built directly from TALLY_BUNDLE_ID_PREFIX (not from
        # $(PRODUCT_BUNDLE_IDENTIFIER)) — see TALLY_SHARED_APP_GROUP_ID above.
        PRODUCT_BUNDLE_IDENTIFIER: $(TALLY_BUNDLE_ID_PREFIX).tally.widgets
        # See the identical settings (and their comments) on the Tally target.
        OTHER_SWIFT_FLAGS: -parse-as-library
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated/TallyWidgets-Info.plist
      properties:
        CFBundleDisplayName: Tally Widgets
        # Plan 08 L10N-01: the same languages as the app (TallyWidgets/InfoPlist.xcstrings and
        # Localizable.xcstrings supply en.lproj).
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Plan 06 step 11: what the widget process needs to find the glance
        # (TallyGlance.GlanceConfiguration). The app's bundle ID names the vault
        # key's Keychain service; the Team ID prefix ("ABCDE12345.", empty until
        # GO-LIVE GL-02) plus the App Group ID is that key's access group.
        TallyAppGroupID: $(TALLY_SHARED_APP_GROUP_ID)
        TallyAppBundleID: $(TALLY_BUNDLE_ID_PREFIX).tally
        TallyKeychainAccessGroupPrefix: $(AppIdentifierPrefix)
    dependencies:
      - package: TallyAppleKit
        product: TallyDesignSystem
      # The glance reader, timeline and views. Not TallyIntents (it links
      # TallySync and TallyCanvasAPI) and never TallyFeatures or TallyPlatform:
      # the widget reads the glance only (CI's widget isolation gates).
      - package: TallyAppleKit
        product: TallyGlance

  TallyAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TallyAppTests
    configFiles:
      Debug: Config/Identity.xcconfig
      Release: Config/Identity.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # This bundle links AppIntents-containing code two ways: TallyIntents
        # (RefreshIntentBridge, E04) and TallyPlatform's WidgetKit import
        # (WidgetReloader, M2 platform-adapters batch; WidgetKit auto-links
        # AppIntents). Xcode's App Intents metadata/SSU-training build phases
        # therefore run for it, and without an explicit bundle id
        # AppIntentsSSUTraining invokes with a blank `--bundle-id` and fails
        # with "Unable to parse Info.plist" (confirmed on CI run 36334863817).
        # TallyUITests doesn't need this: it links neither.
        PRODUCT_BUNDLE_IDENTIFIER: $(TALLY_BUNDLE_ID_PREFIX).tally.tests
    dependencies:
      - target: Tally
      - package: TallyAppleKit
        product: TallyPlatform
      - package: TallyAppleKit
        product: TallyFeatures
      # TallyPlatform/TallyFeatures depend on these internally, but SwiftPM/Xcode
      # does not re-export a target's own dependencies to *its* clients: a test
      # file that imports TallyCanvasAPI/TallyStore/TallyDomain/TallySync/
      # TallyTestSupport/TallyIntents directly (to build HTTPRequest fixtures,
      # KeyScope, RefreshCoordinator, RefreshIntentBridge, etc.) needs them
      # linked into TallyAppTests too, or the compile succeeds but the link
      # fails with "Undefined symbols" (confirmed on CI run 36332912599).
      - package: TallyAppleKit
        product: TallyIntents
      # WidgetGlanceTests: the widget's reader, timeline, Keychain parity and views.
      - package: TallyAppleKit
        product: TallyGlance
      # LocalizationTests (plan 08 L10N-01): L10n, TallyFormat and TallyLocale.
      - package: TallyAppleKit
        product: TallyStrings
      - package: TallyCore
        product: TallyDomain
      - package: TallyCore
        product: TallyCanvasAPI
      - package: TallyCore
        product: TallyStore
      - package: TallyCore
        product: TallySync
      - package: TallyCore
        product: TallyTestSupport

  TallyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TallyUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tally

schemes:
  Tally:
    build:
      targets:
        Tally: [run, test, analyze, archive]
        TallyWidgets: [run, analyze, archive]
        TallyAppTests: [test]
        TallyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TallyAppTests
        - TallyUITests
    archive:
      config: Release
